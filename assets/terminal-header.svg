<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020b12"/>
      <stop offset="100%" stop-color="#061522"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e68a"/>
      <stop offset="100%" stop-color="#00cfff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#0b3443" opacity=".4"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="16"
        fill="none" stroke="#00cfff"/>

  <!-- Terminal title bar -->
  <circle cx="28" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="22" r="6" fill="#febc2e"/>
  <circle cx="72" cy="22" r="6" fill="#28c840"/>

  <text x="98" y="28" fill="#55dfff"
        font-family="monospace" font-size="16">
    visitor@vijayakumar-profile
  </text>
  <text x="1125" y="28" fill="#6b9eae"
        text-anchor="end" font-family="monospace" font-size="13">
    README.md
  </text>

  <path d="M18 42H1182" stroke="#07536a"/>

  <!-- Main identity -->
  <text x="52" y="126" fill="url(#neon)"
        font-family="monospace" font-size="58" font-weight="bold">
    Vijayakumar Chinta
  </text>

  <text x="56" y="166" fill="#00cfff"
        font-family="monospace" font-size="20" font-weight="bold">
    BACKEND DEVELOPER
  </text>
  <text x="335" y="166" fill="#7a9bad" font-family="monospace">·</text>
  <text x="358" y="166" fill="#00cfff"
        font-family="monospace" font-size="20" font-weight="bold">
    PYTHON
  </text>
  <text x="470" y="166" fill="#7a9bad" font-family="monospace">·</text>
  <text x="493" y="166" fill="#a78bfa"
        font-family="monospace" font-size="20" font-weight="bold">
    IIoT SOFTWARE ENGINEERING
  </text>

  <circle cx="62" cy="207" r="6" fill="#00e68a"/>
  <text x="80" y="213" fill="#00e68a"
        font-family="monospace" font-size="16" font-weight="bold">
    OPEN TO OPPORTUNITIES
  </text>

  <text x="348" y="213" fill="#7ddfff"
        font-family="monospace" font-size="16">
    ⌖ HYDERABAD, INDIA
  </text>

  <!-- Animated engineering waveform -->
  <g transform="translate(790 70)">
    <path d="M0 140 L55 110 L105 128 L165 54
             L225 90 L285 18 L345 82 L400 44"
          fill="none" stroke="#00cfff" stroke-width="2">
      <animate attributeName="opacity"
               values=".45;1;.45" dur="3s" repeatCount="indefinite"/>
    </path>

    <path d="M0 154 L55 132 L105 143 L165 88
             L225 112 L285 58 L345 105 L400 75"
          fill="none" stroke="#a78bfa" stroke-width="1.5"
          stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset"
               from="0" to="-36" dur="3s" repeatCount="indefinite"/>
    </path>

    <path d="M0 168H410" stroke="#08738a"/>

    <g fill="#00e68a" font-family="monospace" font-size="14">
      <text x="315" y="145">&gt; Build</text>
      <text x="315" y="165">&gt; Learn</text>
      <text x="315" y="185">&gt; Grow</text>
    </g>
  </g>

  <text x="56" y="252" fill="#5b8494"
        font-family="monospace" font-size="13">
    Building systems. Solving problems. Improving continuously.
  </text>
</svg>